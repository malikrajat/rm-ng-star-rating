<div class="star-rating-container">
  <div class="star-rating" [style.font-size.px]="size()">
    @for (star of starsArray(); track i; let i = $index) {
      <span
        class="star-wrapper"
        (mouseenter)="onMouseEnter(i + 1, $event)"
        (mousemove)="allowHalf() ? onMouseEnter(i + 1, $event) : null"
        (mouseleave)="onMouseLeave()"
      >
        <span
          class="star"
          [class]="getStarClass(i + 1)"
          (click)="onClick(i + 1, $event)"
        >
          ★
        </span>
      </span>
    }
  </div>
</div>
